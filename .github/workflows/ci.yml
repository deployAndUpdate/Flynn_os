name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swatinem/rust-cache@v2

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (kernel)
        run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings

      - name: clippy (host runner)
        run: cargo clippy -p flynn_os -- -D warnings

      - name: build kernel
        run: cargo build -p kernel --target x86_64-unknown-none

      - name: build workspace
        run: cargo build

      - name: QEMU smoke test
        run: ./scripts/smoke_test.sh

      - name: Preempt stability (10 runs)
        run: PREEMPT_STABILITY_RUNS=10 ./scripts/preempt_stability_test.sh
